<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#000814">
<title>Jarvis</title>
<style>
html,body{margin:0;height:100%;background:#000814;color:#9fe8ff;font-family:-apple-system,Helvetica,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);box-sizing:border-box}
canvas{flex:1;width:100%;min-height:0;touch-action:manipulation}
#status{text-align:center;font-size:14px;letter-spacing:2px;text-transform:uppercase;opacity:.8;height:20px}
#text{text-align:center;font-size:17px;line-height:1.4;max-height:30%;overflow:auto;padding:8px 4px}
#row{display:flex;gap:8px;padding:8px 0}
input{flex:1;min-width:0;font-size:16px;padding:12px;border-radius:12px;border:1px solid #1d4a63;background:#001a2e;color:#cff4ff}
button{font-size:16px;padding:12px 16px;border-radius:12px;border:0;background:#0aa6d6;color:#00131f}
#cfg{background:#1d4a63;color:#cff4ff}
</style>
</head>
<body>
<div id="app">
  <canvas id="orb"></canvas>
  <div id="status"></div>
  <div id="text"></div>
  <div id="row">
    <input id="inp" placeholder="Oppure scrivi qui…">
    <button id="send">Invia</button>
    <button id="cfg">⚙</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const store={
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}
};
let state='idle',history=[];
const SYS='Sei Jarvis, un assistente personale elegante, ironico e molto efficiente. Rispondi sempre in italiano, in modo breve e parlato (massimo 3 frasi), senza elenchi né formattazione. Oggi è '+new Date().toLocaleString('it-IT')+'.';

function setState(s){
  state=s;
  $('status').textContent={idle:'Tocca il cerchio',listening:'Ti ascolto…',thinking:'Elaboro…',speaking:'Parlo…'}[s];
}

function config(){
  const k=prompt('Incolla la tua chiave Gemini:',store.get('key')||'');
  if(k!==null&&k.trim())store.set('key',k.trim());
  const m=prompt('Modello (lascia così se non sai):',store.get('model')||'gemini-flash-latest');
  if(m!==null&&m.trim())store.set('model',m.trim());
}

async function ask(q){
  if(!store.get('key')){config();if(!store.get('key'))return;}
  setState('thinking');
  history.push({role:'user',parts:[{text:q}]});
  try{
    const model=store.get('model')||'gemini-flash-latest';
    const url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(store.get('key'));
    const r=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:history.slice(-20)})
    });
    const j=await r.json();
    if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
    const a=j.candidates[0].content.parts.map(p=>p.text||'').join('').trim();
    history.push({role:'model',parts:[{text:a}]});
    $('text').textContent=a;
    speak(a);
  }catch(e){
    history.pop();
    $('text').textContent='Errore: '+e.message;
    setState('idle');
  }
}

function speak(t){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/[*_#`]/g,''));
  u.lang='it-IT';
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('it'));
  if(v)u.voice=v;
  u.onstart=()=>setState('speaking');
  u.onend=u.onerror=()=>setState('idle');
  speechSynthesis.speak(u);
}

function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$('text').textContent='Il riconoscimento vocale non è disponibile qui: scrivi nella casella.';return;}
  const r=new SR();
  r.lang='it-IT';
  r.interimResults=false;
  let got=false;
  r.onstart=()=>{setState('listening');$('text').textContent='';};
  r.onresult=e=>{got=true;const t=e.results[0][0].transcript;$('text').textContent='« '+t+' »';ask(t);};
  r.onerror=e=>{$('text').textContent='Microfono: '+e.error;setState('idle');};
  r.onend=()=>{if(!got&&state==='listening')setState('idle');};
  r.start();
}

$('orb').addEventListener('click',()=>{
  if(state==='speaking'){speechSynthesis.cancel();setState('idle');return;}
  if(state==='thinking'||state==='listening')return;
  speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  listen();
});
$('send').onclick=()=>{
  const q=$('inp').value.trim();
  if(!q)return;
  $('inp').value='';
  speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  $('text').textContent='« '+q+' »';
  ask(q);
};
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click();});
$('cfg').onclick=config;
speechSynthesis.getVoices();

const cv=$('orb'),ctx=cv.getContext('2d');
function fit(){const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;}
addEventListener('resize',fit);
fit();
let t=0;
function draw(){
  t+=0.02;
  const d=devicePixelRatio||1,w=cv.width,h=cv.height,cx=w/2,cy=h/2,R=Math.min(w,h)*0.22;
  ctx.clearRect(0,0,w,h);
  const amp={idle:.03,listening:.12,thinking:.06,speaking:.16}[state];
  const spd={idle:1,listening:2,thinking:4,speaking:3}[state];
  const col={idle:'10,166,214',listening:'80,255,200',thinking:'255,190,60',speaking:'10,200,255'}[state];
  const pulse=1+amp*Math.sin(t*spd*2)+(state==='speaking'?amp*.5*Math.sin(t*11):0);
  const g=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,R*pulse*2.2);
  g.addColorStop(0,'rgba('+col+',.55)');
  g.addColorStop(1,'rgba('+col+',0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(cx,cy,R*pulse*2.2,0,7);ctx.fill();
  for(let i=0;i<3;i++){
    ctx.strokeStyle='rgba('+col+','+(0.9-i*.25)+')';
    ctx.lineWidth=(3-i)*d;
    ctx.setLineDash([R*.3,R*.15*(i+1)]);
    ctx.lineDashOffset=-t*spd*R*.3*(i%2?-1:1);
    ctx.beginPath();ctx.arc(cx,cy,R*pulse*(1+i*.28),0,7);ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.fillStyle='rgba('+col+',.9)';
  ctx.beginPath();ctx.arc(cx,cy,R*.35*pulse,0,7);ctx.fill();
  requestAnimationFrame(draw);
}
setState('idle');
$('text').textContent='Buongiorno. Tocca ⚙ per inserire la chiave, poi tocca il cerchio e parlami.';
draw();
</script>
 <script>
function speak(t){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/[*_#`]/g,''));
  const all=speechSynthesis.getVoices();
  const pref=(store.get('voice')||'Luca').toLowerCase();
  const v=all.find(x=>x.name.toLowerCase().includes(pref))||all.find(x=>x.lang&&x.lang.startsWith('it'));
  if(v){u.voice=v;u.lang=v.lang;}else{u.lang='it-IT';}
  u.rate=0.95;u.pitch=0.9;
  u.onstart=()=>setState('speaking');
  u.onend=u.onerror=()=>setState('idle');
  speechSynthesis.speak(u);
}
function config(){
  const k=prompt('Chiave Gemini:',store.get('key')||'');
  if(k!==null&&k.trim())store.set('key',k.trim());
  const m=prompt('Modello:',store.get('model')||'gemini-flash-latest');
  if(m!==null&&m.trim())store.set('model',m.trim());
  const names=speechSynthesis.getVoices().filter(x=>/^(it|en)/.test(x.lang)).map(x=>x.name).join(', ');
  const n=prompt('Voce (scrivi il nome, es. Luca o Daniel). Disponibili: '+names,store.get('voice')||'Luca');
  if(n!==null&&n.trim())store.set('voice',n.trim());
}
$('cfg').onclick=config;
</script>

  speechSynthesis.cancel();

  u.lang='it-IT';
  u.rate=0.95;
  u.pitch=0.9;
  u.onstart=()=>setState('speaking');

</script>
 <script>
(function(){
  const css=document.createElement('style');
  css.textContent=`
  #app{position:relative;z-index:1}
  #grid{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(0,200,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.07) 1px,transparent 1px);
    background-size:32px 32px;
    -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%);
    mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%)}
  #scan{position:fixed;left:0;right:0;height:120px;z-index:2;pointer-events:none;
    background:linear-gradient(transparent,rgba(0,200,255,.08),transparent);
    animation:scan 6s linear infinite}
  @keyframes scan{from{top:-120px}to{top:100%}}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none;
    font-family:ui-monospace,Menlo,monospace;color:#7fdcff;
    text-transform:uppercase;letter-spacing:1.5px}
  #hud .p{position:absolute;font-size:11px;line-height:1.7;opacity:.9}
  #hud .tl{top:calc(env(safe-area-inset-top) + 14px);left:16px}
  #hud .tr{top:calc(env(safe-area-inset-top) + 14px);right:16px;text-align:right}
  #hud .ml{top:calc(env(safe-area-inset-top) + 86px);left:16px}
  #hud .mr{top:calc(env(safe-area-inset-top) + 86px);right:16px;text-align:right}
  #hud .big{font-size:20px;letter-spacing:3px;color:#cff4ff}
  #hud b{color:#cff4ff;font-weight:600}
  #hud .c{position:absolute;width:22px;height:22px;border:2px solid rgba(0,200,255,.6)}
  #hud .c1{top:8px;left:8px;border-right:0;border-bottom:0}
  #hud .c2{top:8px;right:8px;border-left:0;border-bottom:0}
  #hud .c3{bottom:8px;left:8px;border-right:0;border-top:0}
  #hud .c4{bottom:8px;right:8px;border-left:0;border-top:0}
  #status{letter-spacing:4px}
  `;
  document.head.appendChild(css);

  const grid=document.createElement('div');grid.id='grid';
  const scan=document.createElement('div');scan.id='scan';
  const hud=document.createElement('div');hud.id='hud';
  hud.innerHTML=
    '<div class="c c1"></div><div class="c c2"></div><div class="c c3"></div><div class="c c4"></div>'+
    '<div class="p tl"><div class="big">JARVIS</div><div>Sistema attivo</div></div>'+
    '<div class="p tr"><div class="big" id="hClock">--:--:--</div><div id="hDate"></div></div>'+
    '<div class="p ml"><div>Stato <b id="hState">-</b></div><div>Rete <b id="hNet">-</b></div></div>'+
    '<div class="p mr"><div>Scambi <b id="hN">0</b></div><div>Modello <b id="hModel">-</b></div></div>';
  document.body.appendChild(grid);
  document.body.appendChild(scan);
  document.body.appendChild(hud);

  const stati={idle:'In attesa',listening:'Ascolto',thinking:'Elaboro',speaking:'Parlo'};
  function tick(){
    const n=new Date();
    document.getElementById('hClock').textContent=n.toLocaleTimeString('it-IT');
    document.getElementById('hDate').textContent=n.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'short'});
    document.getElementById('hState').textContent=stati[state]||'';
    document.getElementById('hNet').textContent=navigator.onLine?'Online':'Offline';
    document.getElementById('hN').textContent=Math.floor(history.length/2);
    document.getElementById('hModel').textContent=(store.get('model')||'').replace('gemini-','');
  }
  setInterval(tick,500);
  tick();
})();

let tt=0;
function draw(){
  tt+=0.016;
  const d=devicePixelRatio||1,w=cv.width,h=cv.height,cx=w/2,cy=h/2,R=Math.min(w,h)*0.2;
  ctx.setLineDash([]);
  ctx.clearRect(0,0,w,h);
  const col={idle:'0,200,255',listening:'80,255,200',thinking:'255,190,60',speaking:'0,220,255'}[state];
  const spd={idle:1,listening:1.8,thinking:3.5,speaking:2.4}[state];
  const amp={idle:.02,listening:.07,thinking:.04,speaking:.1}[state];
  const pulse=1+amp*Math.sin(tt*spd*3)+(state==='speaking'?amp*.6*Math.sin(tt*13):0);

  const g=ctx.createRadialGradient(cx,cy,R*.1,cx,cy,R*2.6);
  g.addColorStop(0,'rgba('+col+',.35)');
  g.addColorStop(1,'rgba('+col+',0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(cx,cy,R*2.6,0,7);ctx.fill();

  ctx.save();ctx.translate(cx,cy);ctx.rotate(tt*.15*spd);
  for(let i=0;i<72;i++){
    const a=i/72*Math.PI*2,long=i%6===0;
    const r1=R*1.95,r2=R*(long?1.78:1.86);
    ctx.strokeStyle='rgba('+col+','+(long?.9:.4)+')';
    ctx.lineWidth=(long?2:1)*d;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
    ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    ctx.stroke();
  }
  ctx.restore();

  [[1.6,3,.5],[1.35,2,-.8],[1.1,4,1.2]].forEach((rg,k)=>{
    ctx.save();ctx.translate(cx,cy);ctx.rotate(tt*rg[2]*spd*.6);
    ctx.strokeStyle='rgba('+col+','+(.85-k*.2)+')';
    ctx.lineWidth=(3-k*.6)*d;
    for(let s=0;s<rg[1];s++){
      const a0=s/rg[1]*Math.PI*2,a1=a0+Math.PI*2/rg[1]*.62;
      ctx.beginPath();ctx.arc(0,0,R*rg[0]*pulse,a0,a1);ctx.stroke();
    }
    ctx.restore();
  });

  if(state==='speaking'||state==='listening'){
    ctx.strokeStyle='rgba('+col+',.9)';
    ctx.lineWidth=2*d;
    ctx.beginPath();
    const N=96;
    for(let i=0;i<=N;i++){
      const a=i/N*Math.PI*2;
      const wob=Math.sin(a*7+tt*9)*Math.sin(a*3-tt*5)*(state==='speaking'?.14:.07);
      const r=R*(.78+Math.abs(wob)*1.4)*pulse;
      const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
      if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);
    }
    ctx.closePath();ctx.stroke();
  }

  ctx.fillStyle='rgba('+col+',.9)';
  ctx.beginPath();ctx.arc(cx,cy,R*.3*pulse,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.7)';
  ctx.lineWidth=1.5*d;
  ctx.beginPath();ctx.arc(cx,cy,R*.42*pulse,0,7);ctx.stroke();

  for(let i=0;i<3;i++){
    const a=tt*(.9+i*.5)*spd+i*2.1,r=R*2.15;
    ctx.fillStyle='rgba('+col+',.95)';
    ctx.beginPath();ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,3*d,0,7);ctx.fill();
  }
  requestAnimationFrame(draw);
}
</script>
<script>
const SYS4=SYS+' Quando nel messaggio ci sono DATI REALI, usali per rispondere con precisione (temperature e orari esatti) citando la fonte in modo naturale e senza leggere numeri superflui. Se non hai dati reali e la domanda richiede informazioni aggiornate, dì onestamente che non puoi verificarle: non inventare mai.';

async function gen(model,contents,json,sys){
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(store.get('key'));
  const body={systemInstruction:{parts:[{text:sys||SYS4}]},contents:contents};
  if(json)body.generationConfig={responseMimeType:'application/json'};
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
  return j.candidates[0].content.parts.map(p=>p.text||'').join('').trim();
}

async function route(model,q){
  try{
    const t=await gen(model,[{role:'user',parts:[{text:'Classifica questa richiesta. Rispondi SOLO con JSON nel formato {"tipo":"meteo|alba_tramonto|wiki|altro","luogo":"","argomento":""}. "meteo" per tempo, temperature, pioggia; "alba_tramonto" per orario di alba o tramonto; "wiki" per chiedere chi è o cos è qualcosa o qualcuno; "altro" per tutto il resto. "luogo" è la città citata (vuoto se non c\'è). "argomento" è il termine da cercare per "wiki". Richiesta: '+q}]}],true,'Sei un classificatore. Rispondi solo con JSON valido.');
    return JSON.parse(t);
  }catch(e){return {tipo:'altro'};}
}

async function geo(nome){
  const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(nome)+'&count=1&language=it&format=json');
  const j=await r.json();
  if(!j.results||!j.results.length)throw new Error('città non trovata: '+nome);
  return j.results[0];
}

async function datiMeteo(luogo){
  const g=await geo(luogo);
  const u='https://api.open-meteo.com/v1/forecast?latitude='+g.latitude+'&longitude='+g.longitude+'&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,weather_code&timezone=auto&forecast_days=3';
  const r=await fetch(u);
  const j=await r.json();
  return {fonte:'Open-Meteo, '+g.name,testo:'Località: '+g.name+'. Orari nel fuso locale, codici meteo WMO. '+JSON.stringify({adesso:j.current,giorni:j.daily})};
}

async function datiWiki(arg){
  const u='https://it.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(arg)+'&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&exchars=1200&format=json&origin=*';
  const r=await fetch(u);
  const j=await r.json();
  const pages=j.query&&j.query.pages;
  if(!pages)throw new Error('nessun risultato');
  const p=Object.values(pages)[0];
  return {fonte:'Wikipedia, '+p.title,testo:p.title+': '+p.extract};
}

async function ask(q){
  if(!store.get('key')){config();if(!store.get('key'))return;}
  setState('thinking');
  history.push({role:'user',parts:[{text:q}]});
  try{
    const model=store.get('model')||'gemini-3.5-flash-lite';
    const rt=await route(model,q);
    let dati=null,errDati='';
    try{
      if(rt.tipo==='meteo'||rt.tipo==='alba_tramonto'){
        let luogo=(rt.luogo||'').trim()||store.get('city')||'';
        if(!luogo){
          luogo=(prompt('Di quale città parli? La ricordo per la prossima volta.')||'').trim();
          if(luogo)store.set('city',luogo);
        }
        if(luogo)dati=await datiMeteo(luogo);
      }else if(rt.tipo==='wiki'&&rt.argomento){
        dati=await datiWiki(rt.argomento);
      }
    }catch(e){errDati=e.message;}
    const contents=history.slice(-20);
    if(dati)contents[contents.length-1]={role:'user',parts:[{text:q+'\n\n[DATI REALI — fonte: '+dati.fonte+'. Usa questi dati per rispondere. '+dati.testo+']'}]};
    const a=await gen(model,contents,false,SYS4);
    history.push({role:'model',parts:[{text:a}]});
    let note='';
    if(dati)note='\n\n🔎 '+dati.fonte;
    else if(errDati)note='\n\n(dati non disponibili: '+errDati+')';
    $('text').textContent=a+note;
    speak(a);
  }catch(e){
    history.pop();
    $('text').textContent='Errore: '+e.message;
    setState('idle');
  }
}
</script>
<script>
(function(){
  let S={};
  try{S=JSON.parse(store.get('stats')||'{}');}catch(e){S={};}
  S.n=S.n||0;S.parole=S.parole||0;S.voc=S.voc||[];
  const vocSet=new Set(S.voc);
  let flash=0;
  function salva(){
    S.voc=Array.from(vocSet).slice(-4000);
    store.set('stats',JSON.stringify(S));
  }
  function conta(testo){
    const w=(testo||'').toLowerCase().match(/[a-zàèéìòù]{2,}/g)||[];
    S.parole+=w.length;
    let nuovi=0;
    w.forEach(x=>{if(!vocSet.has(x)){vocSet.add(x);nuovi++;}});
    return nuovi;
  }
  const askOrig=ask;
  ask=async function(q){
    if(conta(q)>0)flash=1;
    await askOrig(q);
    const r=($('text').textContent||'').split('\n\n')[0];
    if(r&&!/^Errore:/.test(r)&&r.charAt(0)!=='«'){
      if(conta(r)>0)flash=1;
      S.n+=1;
    }
    salva();
  };

  document.title='J.A.R.V.I.S';
  const big=document.querySelector('#hud .tl .big');
  if(big){big.textContent='J.A.R.V.I.S';}
  else{
    const titolo=document.createElement('div');
    titolo.textContent='J.A.R.V.I.S';
    titolo.style.cssText='position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;text-align:center;z-index:3;pointer-events:none;font:700 20px ui-monospace,Menlo,monospace;letter-spacing:4px;color:#cff4ff';
    document.body.appendChild(titolo);
  }

  const CFG={
    idle:{col:'150,205,255',vel:.12,amp:.012},
    listening:{col:'110,255,210',vel:.25,amp:.05},
    thinking:{col:'255,200,90',vel:.9,amp:.03},
    speaking:{col:'120,225,255',vel:.3,amp:.09}
  };
  let nodi=[],nTot=0,rot=0;
  const T0=performance.now();
  function costruisci(n){
    nodi=[];
    const ga=Math.PI*(3-Math.sqrt(5));
    for(let i=0;i<n;i++){
      const y=1-(i/(n-1))*2;
      const r=Math.sqrt(Math.max(0,1-y*y));
      const th=ga*i;
      const rad=0.6+Math.random()*0.45;
      nodi.push({x:Math.cos(th)*r*rad,y:y*rad,z:Math.sin(th)*r*rad,f:Math.random()*6.28});
    }
    nTot=n;
  }

  draw=function(){
    const d=devicePixelRatio||1,w=cv.width,h=cv.height,cx=w/2,cy=h*0.5;
    const R=Math.min(w,h)*0.3;
    const neuroni=vocSet.size;
    const n=Math.min(200,70+Math.floor(neuroni/4));
    if(n!==nTot)costruisci(n);
    const c=CFG[state]||CFG.idle;
    const t=(performance.now()-T0)/1000;
    ctx.setLineDash([]);
    ctx.clearRect(0,0,w,h);
    rot+=c.vel*0.016;
    flash*=0.97;
    const cs=Math.cos(rot),sn=Math.sin(rot),ct=Math.cos(.35),st=Math.sin(.35);
    const K=R*1.55;
    const P=nodi.map(p=>{
      const wob=1+c.amp*Math.sin(t*(state==='speaking'?9:2.5)+p.f*3);
      const x=p.x*wob,y=p.y*wob,z=p.z*wob;
      const x1=x*cs+z*sn,z1=-x*sn+z*cs;
      const y1=y*ct-z1*st,z2=y*st+z1*ct;
      const pr=1/(1.9-z2*0.6);
      return {sx:cx+x1*K*pr,sy:cy+y1*K*pr,z:z2};
    });

    const g=ctx.createRadialGradient(cx,cy,R*.1,cx,cy,R*2.2);
    g.addColorStop(0,'rgba('+c.col+','+(0.28+0.2*flash).toFixed(3)+')');
    g.addColorStop(1,'rgba('+c.col+',0)');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,w,h);

    const maxD=Math.pow(R*0.36,2);
    ctx.lineWidth=d;
    for(let i=0;i<P.length;i++){
      const a=P[i];
      for(let j=i+1;j<P.length;j++){
        const b=P[j];
        const dx=a.sx-b.sx,dy=a.sy-b.sy,dd=dx*dx+dy*dy;
        if(dd<maxD){
          const dep=((a.z+b.z)/2+1)/2;
          const al=(1-dd/maxD)*(0.15+0.5*dep)+0.15*flash;
          ctx.strokeStyle='rgba('+c.col+','+al.toFixed(3)+')';
          ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke();
        }
      }
    }

    P.forEach(p=>{
      const dep=(p.z+1)/2;
      ctx.fillStyle='rgba('+c.col+','+(0.35+0.6*dep).toFixed(2)+')';
      ctx.beginPath();ctx.arc(p.sx,p.sy,(1.2+2.2*dep)*d*(1+0.5*flash),0,7);ctx.fill();
    });

    if((state==='thinking'||state==='speaking')&&P.length){
      for(let i=0;i<5;i++){
        const p=P[Math.floor(t*(state==='thinking'?7:4)+i*41)%P.length];
        ctx.fillStyle='rgba('+c.col+',.35)';
        ctx.beginPath();ctx.arc(p.sx,p.sy,9*d,0,7);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.95)';
        ctx.beginPath();ctx.arc(p.sx,p.sy,3.5*d,0,7);ctx.fill();
      }
    }

    const g3=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.5);
    g3.addColorStop(0,'rgba(255,255,255,'+(0.3+0.2*Math.sin(t*3)+0.2*flash).toFixed(3)+')');
    g3.addColorStop(1,'rgba('+c.col+',0)');
    ctx.fillStyle=g3;
    ctx.beginPath();ctx.arc(cx,cy,R*.5,0,7);ctx.fill();

    ctx.textAlign='center';
    ctx.fillStyle='rgba(207,244,255,.95)';
    ctx.font='700 '+(34*d)+'px ui-monospace,Menlo,monospace';
    ctx.fillText(S.parole.toLocaleString('it-IT'),cx,h-70*d);
    ctx.fillStyle='rgba('+c.col+',.9)';
    ctx.font=(11*d)+'px ui-monospace,Menlo,monospace';
    ctx.fillText('INFORMAZIONI ANALIZZATE',cx,h-46*d);
    ctx.fillText('NEURONI '+neuroni.toLocaleString('it-IT')+'  ·  SINAPSI '+S.n.toLocaleString('it-IT'),cx,h-26*d);

    requestAnimationFrame(draw);
  };
})();
</script>

<script>
(function(){
  const MAX=60;
  function leggi(){
    try{const m=JSON.parse(store.get('memoria')||'[]');return Array.isArray(m)?m:[];}catch(e){return [];}
  }
  function scrivi(m){store.set('memoria',JSON.stringify(m.slice(-MAX)));}
  function nome(){return store.get('nome')||'signore';}

  window.memoriaTesto=function(){
    const m=leggi();
    if(!m.length)return '';
    return ' MEMORIA: queste sono informazioni personali che l\'utente ti ha chiesto di ricordare su di lui (parlano in prima persona dell\'utente). Usale quando sono utili, senza elencarle se non richiesto: '+m.map((x,i)=>(i+1)+') '+x).join(' ')+'.';
  };

  const persona0=(typeof persona==='function')?persona:function(){return '';};
  persona=function(){return persona0()+window.memoriaTesto();};

  const STOP=['che','del','dei','della','delle','mio','mia','miei','mie','sul','per','con','una','uno','gli','nel','alla','dal','dai','sono','come'];

  function comando(q){
    const t=q.trim();
    let m;
    if((m=t.match(/^(?:jarvis[,:]?\s+)?(?:ricorda(?:ti)?|memorizza|tieni a mente|segnati)\s*(?:che|:)?\s+(.{3,})$/i))){
      let f=m[1].trim().replace(/[.!\s]+$/,'');
      if(f.length>200)f=f.slice(0,200);
      const mem=leggi();
      if(!mem.some(x=>x.toLowerCase()===f.toLowerCase()))mem.push(f);
      scrivi(mem);
      return 'Annotato, '+nome()+'. Lo terrò a mente.';
    }
    if((m=t.match(/^(?:jarvis[,:]?\s+)?(?:dimentica(?:ti)?|cancella dalla memoria|elimina dalla memoria)\s*(?:che|di|:)?\s+(.{2,})$/i))){
      const arg=m[1].trim().toLowerCase().replace(/[.!\s]+$/,'');
      if(/^(tutto|ogni cosa|tutta la memoria)$/.test(arg)){
        if(confirm('Cancello tutta la memoria di Jarvis?')){scrivi([]);return 'Memoria cancellata, '+nome()+'.';}
        return 'Come desidera, non ho cancellato nulla.';
      }
      const parole=(arg.match(/[a-zàèéìòù0-9]{3,}/g)||[]).filter(p=>STOP.indexOf(p)<0);
      if(!parole.length)return 'Mi dica cosa devo dimenticare, '+nome()+'.';
      const mem=leggi();
      const resto=mem.filter(x=>!parole.some(p=>x.toLowerCase().includes(p)));
      const n=mem.length-resto.length;
      scrivi(resto);
      return n?('Fatto, ho dimenticato '+n+(n===1?' cosa.':' cose.')):'Non trovo nulla di simile nei miei ricordi.';
    }
    if(/\b(?:cosa|che cosa|quali cose)\s+(?:ricordi|sai\s+(?:di|su)\s+me|ti ho (?:detto|chiesto di ricordare))/i.test(t)){
      const mem=leggi();
      if(!mem.length)return 'Per ora non ricordo nulla di particolare, '+nome()+'.';
      return 'Ecco cosa ricordo, '+nome()+'. '+mem.map((x,i)=>(i+1)+': '+x).join('. ')+'.';
    }
    return null;
  }

  function salvaStoria(){
    try{
      let h=history.slice(-12);
      while(h.length&&h[0].role!=='user')h.shift();
      store.set('hist',JSON.stringify(h));
    }catch(e){}
  }
  try{
    const h=JSON.parse(store.get('hist')||'[]');
    if(Array.isArray(h)&&!history.length)h.forEach(x=>history.push(x));
  }catch(e){}

  const ask0=ask;
  ask=async function(q){
    const r=comando(q);
    if(r){
      $('text').textContent=r;
      setState('idle');
      speak(r);
      return;
    }
    await ask0(q);
    salvaStoria();
  };

  const lab=document.createElement('div');
  lab.style.cssText='position:fixed;left:16px;top:calc(env(safe-area-inset-top) + 150px);z-index:3;pointer-events:none;font:11px ui-monospace,Menlo,monospace;letter-spacing:1.5px;text-transform:uppercase;color:#7fdcff;opacity:.85';
  document.body.appendChild(lab);
  setInterval(()=>{const n=leggi().length;lab.textContent='Memoria '+n+(n===1?' ricordo':' ricordi');},1000);
})();
</script>
<script>
let recognition;
let isListeningActive = false;

function initVoiceAssistant() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        console.warn("Il vostro browser non supporta il riconoscimento vocale nativo, signore.");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'it-IT';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = function(event) {
        const spokenText = event.results[0][0].transcript.toLowerCase();
        console.log("Comando vocale ricevuto:", spokenText);

        if (spokenText.includes("jarvis") || isListeningActive) {
            const cleanCommand = spokenText.replace("jarvis", "").trim();
            if (cleanCommand.length > 0) {
                document.getElementById('userInput').value = cleanCommand;
                sendMessage();
            }
        }
    };

    recognition.onerror = function(event) {
        console.error("Errore nel riconoscimento vocale:", event.error);
    };

    recognition.onend = function() {
        if (isListeningActive) {
            try {
                recognition.start();
            } catch (e) {
                console.log("Riavvio ascolto in corso...");
            }
        }
    };
}

function toggleContinuousListening() {
    isListeningActive = !isListeningActive;
    const statusIndicator = document.getElementById('statusText');
    
    if (isListeningActive) {
        initVoiceAssistant();
        recognition.start();
        if (statusIndicator) statusIndicator.innerText = "STATO IN ASCOLTO";
        console.log("Jarvis è ora in ascolto continuo, signore.");
    } else {
        if (recognition) recognition.stop();
        if (statusIndicator) statusIndicator.innerText = "STATO PARLO";
        console.log("Ascolto continuo disattivato.");
    }
}
</script>
