<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#000814">
<title>Jarvis</title>
<style>
html,body{margin:0;height:100%;background:#000814;color:#9fe8ff;font-family:-apple-system,Helvetica,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);box-sizing:border-box}
canvas{flex:1;width:100%;min-height:0;touch-action:manipulation}
#status{text-align:center;font-size:14px;letter-spacing:2px;text-transform:uppercase;opacity:.8;height:20px}
#text{text-align:center;font-size:17px;line-height:1.4;max-height:30%;overflow:auto;padding:8px 4px}
#row{display:flex;gap:8px;padding:8px 0}
input{flex:1;min-width:0;font-size:16px;padding:12px;border-radius:12px;border:1px solid #1d4a63;background:#001a2e;color:#cff4ff}
button{font-size:16px;padding:12px 16px;border-radius:12px;border:0;background:#0aa6d6;color:#00131f}
#cfg{background:#1d4a63;color:#cff4ff}
</style>
</head>
<body>
<div id="app">
  <canvas id="orb"></canvas>
  <div id="status"></div>
  <div id="text"></div>
  <div id="row">
    <input id="inp" placeholder="Oppure scrivi qui…">
    <button id="send">Invia</button>
    <button id="cfg">⚙</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const store={
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}
};
let state='idle',history=[];
const SYS='Sei Jarvis, un assistente personale elegante, ironico e molto efficiente. Rispondi sempre in italiano, in modo breve e parlato (massimo 3 frasi), senza elenchi né formattazione. Oggi è '+new Date().toLocaleString('it-IT')+'.';

function setState(s){
  state=s;
  $('status').textContent={idle:'Tocca il cerchio',listening:'Ti ascolto…',thinking:'Elaboro…',speaking:'Parlo…'}[s];
}

function config(){
  const k=prompt('Incolla la tua chiave Gemini:',store.get('key')||'');
  if(k!==null&&k.trim())store.set('key',k.trim());
  const m=prompt('Modello (lascia così se non sai):',store.get('model')||'gemini-flash-latest');
  if(m!==null&&m.trim())store.set('model',m.trim());
}

async function ask(q){
  if(!store.get('key')){config();if(!store.get('key'))return;}
  setState('thinking');
  history.push({role:'user',parts:[{text:q}]});
  try{
    const model=store.get('model')||'gemini-flash-latest';
    const url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(store.get('key'));
    const r=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:history.slice(-20)})
    });
    const j=await r.json();
    if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
    const a=j.candidates[0].content.parts.map(p=>p.text||'').join('').trim();
    history.push({role:'model',parts:[{text:a}]});
    $('text').textContent=a;
    speak(a);
  }catch(e){
    history.pop();
    $('text').textContent='Errore: '+e.message;
    setState('idle');
  }
}

function speak(t){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/[*_#`]/g,''));
  u.lang='it-IT';
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('it'));
  if(v)u.voice=v;
  u.onstart=()=>setState('speaking');
  u.onend=u.onerror=()=>setState('idle');
  speechSynthesis.speak(u);
}

function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$('text').textContent='Il riconoscimento vocale non è disponibile qui: scrivi nella casella.';return;}
  const r=new SR();
  r.lang='it-IT';
  r.interimResults=false;
  let got=false;
  r.onstart=()=>{setState('listening');$('text').textContent='';};
  r.onresult=e=>{got=true;const t=e.results[0][0].transcript;$('text').textContent='« '+t+' »';ask(t);};
  r.onerror=e=>{$('text').textContent='Microfono: '+e.error;setState('idle');};
  r.onend=()=>{if(!got&&state==='listening')setState('idle');};
  r.start();
}

$('orb').addEventListener('click',()=>{
  if(state==='speaking'){speechSynthesis.cancel();setState('idle');return;}
  if(state==='thinking'||state==='listening')return;
  speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  listen();
});
$('send').onclick=()=>{
  const q=$('inp').value.trim();
  if(!q)return;
  $('inp').value='';
  speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  $('text').textContent='« '+q+' »';
  ask(q);
};
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click();});
$('cfg').onclick=config;
speechSynthesis.getVoices();

const cv=$('orb'),ctx=cv.getContext('2d');
function fit(){const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;}
addEventListener('resize',fit);
fit();
let t=0;
function draw(){
  t+=0.02;
  const d=devicePixelRatio||1,w=cv.width,h=cv.height,cx=w/2,cy=h/2,R=Math.min(w,h)*0.22;
  ctx.clearRect(0,0,w,h);
  const amp={idle:.03,listening:.12,thinking:.06,speaking:.16}[state];
  const spd={idle:1,listening:2,thinking:4,speaking:3}[state];
  const col={idle:'10,166,214',listening:'80,255,200',thinking:'255,190,60',speaking:'10,200,255'}[state];
  const pulse=1+amp*Math.sin(t*spd*2)+(state==='speaking'?amp*.5*Math.sin(t*11):0);
  const g=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,R*pulse*2.2);
  g.addColorStop(0,'rgba('+col+',.55)');
  g.addColorStop(1,'rgba('+col+',0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(cx,cy,R*pulse*2.2,0,7);ctx.fill();
  for(let i=0;i<3;i++){
    ctx.strokeStyle='rgba('+col+','+(0.9-i*.25)+')';
    ctx.lineWidth=(3-i)*d;
    ctx.setLineDash([R*.3,R*.15*(i+1)]);
    ctx.lineDashOffset=-t*spd*R*.3*(i%2?-1:1);
    ctx.beginPath();ctx.arc(cx,cy,R*pulse*(1+i*.28),0,7);ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.fillStyle='rgba('+col+',.9)';
  ctx.beginPath();ctx.arc(cx,cy,R*.35*pulse,0,7);ctx.fill();
  requestAnimationFrame(draw);
}
setState('idle');
$('text').textContent='Buongiorno. Tocca ⚙ per inserire la chiave, poi tocca il cerchio e parlami.';
draw();
</script>
  <script>
function speak(t){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/[*_#`]/g,''));
  const all=speechSynthesis.getVoices();
  const pref=(store.get('voice')||'Luca').toLowerCase();
  const v=all.find(x=>x.name.toLowerCase().includes(pref))||all.find(x=>x.lang&&x.lang.startsWith('it'));
  if(v){u.voice=v;u.lang=v.lang;}else{u.lang='it-IT';}
  u.rate=0.95;u.pitch=0.9;
  u.onstart=()=>setState('speaking');
  u.onend=u.onerror=()=>setState('idle');
  speechSynthesis.speak(u);
}
function config(){
  const k=prompt('Chiave Gemini:',store.get('key')||'');
  if(k!==null&&k.trim())store.set('key',k.trim());
  const m=prompt('Modello:',store.get('model')||'gemini-flash-latest');
  if(m!==null&&m.trim())store.set('model',m.trim());
  const names=speechSynthesis.getVoices().filter(x=>/^(it|en)/.test(x.lang)).map(x=>x.name).join(', ');
  const n=prompt('Voce (scrivi il nome, es. Luca o Daniel). Disponibili: '+names,store.get('voice')||'Luca');
  if(n!==null&&n.trim())store.set('voice',n.trim());
}
$('cfg').onclick=config;
</script>

  u.lang='it-IT';

<script>
(function(){
  const css=document.createElement('style');
  css.textContent=`
  #app{position:relative;z-index:1}
  #grid{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(0,200,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.07) 1px,transparent 1px);
    background-size:32px 32px;
    -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%);
    mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%)}
  #scan{position:fixed;left:0;right:0;height:120px;z-index:2;pointer-events:none;
    background:linear-gradient(transparent,rgba(0,200,255,.08),transparent);
    animation:scan 6s linear infinite}
  @keyframes scan{from{top:-120px}to{top:100%}}
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none;
    font-family:ui-monospace,Menlo,monospace;color:#7fdcff;
    text-transform:uppercase;letter-spacing:1.5px}
  #hud .p{position:absolute;font-size:11px;line-height:1.7;opacity:.9}
  #hud .tl{top:calc(env(safe-area-inset-top) + 14px);left:16px}
  #hud .tr{top:calc(env(safe-area-inset-top) + 14px);right:16px;text-align:right}
  #hud .ml{top:calc(env(safe-area-inset-top) + 86px);left:16px}
  #hud .mr{top:calc(env(safe-area-inset-top) + 86px);right:16px;text-align:right}
  #hud .big{font-size:20px;letter-spacing:3px;color:#cff4ff}
  #hud b{color:#cff4ff;font-weight:600}
  #hud .c{position:absolute;width:22px;height:22px;border:2px solid rgba(0,200,255,.6)}
  #hud .c1{top:8px;left:8px;border-right:0;border-bottom:0}
  #hud .c2{top:8px;right:8px;border-left:0;border-bottom:0}
  #hud .c3{bottom:8px;left:8px;border-right:0;border-top:0}
  #hud .c4{bottom:8px;right:8px;border-left:0;border-top:0}
  #status{letter-spacing:4px}
  `;
  document.head.appendChild(css);

  const grid=document.createElement('div');grid.id='grid';
  const scan=document.createElement('div');scan.id='scan';
  const hud=document.createElement('div');hud.id='hud';
  hud.innerHTML=
    '<div class="c c1"></div><div class="c c2"></div><div class="c c3"></div><div class="c c4"></div>'+
    '<div class="p tl"><div class="big">JARVIS</div><div>Sistema attivo</div></div>'+
    '<div class="p tr"><div class="big" id="hClock">--:--:--</div><div id="hDate"></div></div>'+
    '<div class="p ml"><div>Stato <b id="hState">-</b></div><div>Rete <b id="hNet">-</b></div></div>'+
    '<div class="p mr"><div>Scambi <b id="hN">0</b></div><div>Modello <b id="hModel">-</b></div></div>';
  document.body.appendChild(grid);
  document.body.appendChild(scan);
  document.body.appendChild(hud);

  const stati={idle:'In attesa',listening:'Ascolto',thinking:'Elaboro',speaking:'Parlo'};
  function tick(){
    const n=new Date();
    document.getElementById('hClock').textContent=n.toLocaleTimeString('it-IT');
    document.getElementById('hDate').textContent=n.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'short'});
    document.getElementById('hState').textContent=stati[state]||'';
    document.getElementById('hNet').textContent=navigator.onLine?'Online':'Offline';
    document.getElementById('hN').textContent=Math.floor(history.length/2);
    document.getElementById('hModel').textContent=(store.get('model')||'').replace('gemini-','');
  }
  setInterval(tick,500);
  tick();
})();

let tt=0;
function draw(){
  tt+=0.016;
  const d=devicePixelRatio||1,w=cv.width,h=cv.height,cx=w/2,cy=h/2,R=Math.min(w,h)*0.2;
  ctx.setLineDash([]);
  ctx.clearRect(0,0,w,h);
  const col={idle:'0,200,255',listening:'80,255,200',thinking:'255,190,60',speaking:'0,220,255'}[state];
  const spd={idle:1,listening:1.8,thinking:3.5,speaking:2.4}[state];
  const amp={idle:.02,listening:.07,thinking:.04,speaking:.1}[state];
  const pulse=1+amp*Math.sin(tt*spd*3)+(state==='speaking'?amp*.6*Math.sin(tt*13):0);

  const g=ctx.createRadialGradient(cx,cy,R*.1,cx,cy,R*2.6);
  g.addColorStop(0,'rgba('+col+',.35)');
  g.addColorStop(1,'rgba('+col+',0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(cx,cy,R*2.6,0,7);ctx.fill();

  ctx.save();ctx.translate(cx,cy);ctx.rotate(tt*.15*spd);
  for(let i=0;i<72;i++){
    const a=i/72*Math.PI*2,long=i%6===0;
    const r1=R*1.95,r2=R*(long?1.78:1.86);
    ctx.strokeStyle='rgba('+col+','+(long?.9:.4)+')';
    ctx.lineWidth=(long?2:1)*d;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
    ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    ctx.stroke();
  }
  ctx.restore();

  [[1.6,3,.5],[1.35,2,-.8],[1.1,4,1.2]].forEach((rg,k)=>{
    ctx.save();ctx.translate(cx,cy);ctx.rotate(tt*rg[2]*spd*.6);
    ctx.strokeStyle='rgba('+col+','+(.85-k*.2)+')';
    ctx.lineWidth=(3-k*.6)*d;
    for(let s=0;s<rg[1];s++){
      const a0=s/rg[1]*Math.PI*2,a1=a0+Math.PI*2/rg[1]*.62;
      ctx.beginPath();ctx.arc(0,0,R*rg[0]*pulse,a0,a1);ctx.stroke();
    }
    ctx.restore();
  });

  if(state==='speaking'||state==='listening'){
    ctx.strokeStyle='rgba('+col+',.9)';
    ctx.lineWidth=2*d;
    ctx.beginPath();
    const N=96;
    for(let i=0;i<=N;i++){
      const a=i/N*Math.PI*2;
      const wob=Math.sin(a*7+tt*9)*Math.sin(a*3-tt*5)*(state==='speaking'?.14:.07);
      const r=R*(.78+Math.abs(wob)*1.4)*pulse;
      const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
      if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);
    }
    ctx.closePath();ctx.stroke();
  }

  ctx.fillStyle='rgba('+col+',.9)';
  ctx.beginPath();ctx.arc(cx,cy,R*.3*pulse,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.7)';
  ctx.lineWidth=1.5*d;
  ctx.beginPath();ctx.arc(cx,cy,R*.42*pulse,0,7);ctx.stroke();

  for(let i=0;i<3;i++){
    const a=tt*(.9+i*.5)*spd+i*2.1,r=R*2.15;
    ctx.fillStyle='rgba('+col+',.95)';
    ctx.beginPath();ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,3*d,0,7);ctx.fill();
  }
  requestAnimationFrame(draw);
}
</script>
<script>
const SYS3=SYS+' Hai accesso alla ricerca sul web: usala quando serve per notizie, meteo, prezzi, risultati sportivi o qualsiasi informazione aggiornata. Non dire mai che non puoi cercare.';

async function callGemini(model,withSearch){
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(store.get('key'));
  const body={systemInstruction:{parts:[{text:SYS3}]},contents:history.slice(-20)};
  if(withSearch)body.tools=[{google_search:{}}];
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
  return j;
}

async function ask(q){
  if(!store.get('key')){config();if(!store.get('key'))return;}
  setState('thinking');
  history.push({role:'user',parts:[{text:q}]});
  try{
    const model=store.get('model')||'gemini-3.5-flash-lite';
    let j,noSearch=false;
    try{j=await callGemini(model,true);}
    catch(e){noSearch=true;j=await callGemini(model,false);}
    const cand=j.candidates[0];
    const a=cand.content.parts.map(p=>p.text||'').join('').trim();
    history.push({role:'model',parts:[{text:a}]});
    const gm=cand.groundingMetadata;
    const qs=gm&&gm.webSearchQueries?gm.webSearchQueries:[];
    let note='';
    if(qs.length)note='\n\n🔎 '+qs.join(' · ');
    else if(noSearch)note='\n\n(ricerca web non disponibile)';
    $('text').textContent=a+note;
    speak(a);
  }catch(e){
    history.pop();
    $('text').textContent='Errore: '+e.message;
    setState('idle');
  }
}
</script>
